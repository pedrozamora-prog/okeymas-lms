<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background: dark rounded square -->
  <rect width="64" height="64" rx="14" fill="#0C0C0C"/>

  <!-- Graduation cap brim (flat top board) -->
  <rect x="10" y="10" width="44" height="10" rx="3" fill="#FCE900"/>

  <!-- Cap crown / tassel line -->
  <rect x="29" y="4" width="6" height="10" rx="2" fill="#FCE900"/>

  <!-- Tassel ball -->
  <circle cx="50" cy="16" r="4" fill="#FCE900"/>
  <line x1="44" y1="15" x2="50" y2="15" stroke="#FCE900" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Lightning bolt body -->
  <polygon
    points="36,20 22,38 30,38 28,58 42,36 34,36"
    fill="#FCE900"
  />
</svg>
